[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omniwave"
version = "0.1.0"
description = "Universal wave perturbation sensing platform MVP"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "OmniWave Team"}]
dependencies = [
  "numpy>=1.25",
  "scipy>=1.11",
  "pyqtgraph>=0.13",
  "PySide6>=6.6",
  "pydantic>=2.0",
  "pyserial>=3.5",
  "scikit-learn>=1.4",
  "pyyaml>=6.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
omniwave = "omniwave.main:main"
omniwave-smoke = "omniwave.main:smoke_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
